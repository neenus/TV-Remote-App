name: Build Android APK

on:
  push:
    branches: [main, feature/**]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # One APK per CPU type instead of one fat APK containing all of them.
      # Release builds are signed with the debug key by default, which is fine for
      # installing on your own phone. They are NOT Play Store upload builds.
      - run: flutter build apk --release --split-per-abi

      - name: Give the files proper names
        run: |
          mkdir dist
          out=build/app/outputs/flutter-apk
          cp "$out/app-arm64-v8a-release.apk"   dist/TV-Remote.apk          # almost every phone since ~2017
          cp "$out/app-armeabi-v7a-release.apk" dist/TV-Remote-32bit.apk    # older 32-bit phones
          cp "$out/app-x86_64-release.apk"      dist/TV-Remote-x86_64.apk   # emulators
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: tv-remote-apk
          path: dist/*.apk
          if-no-files-found: error
